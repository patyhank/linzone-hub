name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libhidapi-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: npm --prefix frontend run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test Go packages
        run: go test ./...

      - name: Build Linux binary
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/linzone-hub

  arch-package:
    name: Arch package smoke test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            dkms \
            git \
            go \
            gtk3 \
            hidapi \
            libusb \
            npm \
            sudo \
            upower \
            webkit2gtk-4.1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Arch packages
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg -f --noconfirm'
          sudo -u builder bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg -f --noconfirm -p PKGBUILD.dkms'
